apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-dev
  namespace: showcase
  labels:
    app: fastapi-showcase
    env: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi-showcase
      env: dev
  template:
    metadata:
      labels:
        app: fastapi-showcase
        env: dev
    spec:
      containers:
        - name: api
          image: fastapi-showcase:local
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_ENV
              value: dev
            - name: APP_VERSION
              value: 0.1.0-dev
            - name: APP_SERVICE_NAME
              value: fastapi-showcase
            - name: APP_PORT
              value: "8000"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-dev
  namespace: showcase
  labels:
    app: fastapi-showcase
    env: dev
spec:
  selector:
    app: fastapi-showcase
    env: dev
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
